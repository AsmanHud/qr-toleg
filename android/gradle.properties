# The Flutter template default is -Xmx8G -XX:MaxMetaspaceSize=4G. On a 16 GB machine
# that (times the Gradle daemon + the Kotlin compile daemon, which inherits these args)
# forces heavy swapping and makes builds crawl. 2 GB is plenty for this app.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768M -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
